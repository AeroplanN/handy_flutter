name: handy
description: "Handy - offline speech-to-text for Android and iOS"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ASR / VAD engine (sherpa-onnx, next-gen Kaldi + onnxruntime)
  sherpa_onnx: ^1.13.8

  # audio capture
  record: ^7.1.1

  # storage
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4
  path: ^1.9.0

  # model downloads
  dio: ^5.11.1

  # platform integration
  share_plus: ^13.3.0
  permission_handler: ^13.0.2
  wakelock_plus: ^1.8.0

  # misc
  provider: ^6.1.5+1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL.txt

  fonts:
    # Рукописный вордмарк «handy» — как в десктопной версии.
    - family: HandyScript
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
